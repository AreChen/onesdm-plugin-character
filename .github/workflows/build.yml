name: Package Download Characters

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 tools/package.py dist
      - run: cd dist && sha256sum --check *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: onesdm-plugin-character
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: onesdm-plugin-character
          path: dist
      - name: Verify and publish the plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
          archive="onesdm-plugin-character-$version.zip"
          (cd dist && sha256sum --check "$archive.sha256")
          unzip -t "dist/$archive"
          unzip -p "dist/$archive" plugin.json | cmp - plugin.json
          gh release create "$GITHUB_REF_NAME" "dist/$archive" "dist/$archive.sha256" \
            --verify-tag --draft --title "Download Characters $version" \
            --notes-file "docs/releases/$version.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
